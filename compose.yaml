services:
  mininovel:
    build:
      context: .
      dockerfile: Dockerfile
    image: mininovel:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MININOVEL_PORT:-9513}:9513"
    environment:
      MININOVEL_HOST: "0.0.0.0"
      MININOVEL_PORT: "9513"
      MININOVEL_DATA_DIR: /data
    volumes:
      - mininovel-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 15s

volumes:
  mininovel-data:
